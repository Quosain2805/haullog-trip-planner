# Render Blueprint: deploys the Django API (free web service).
# The React app is deployed separately on Vercel (see README).
services:
  - type: web
    name: spotter-trip-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # Add your Vercel URL(s), comma separated, e.g. https://my-app.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
